<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр БЖД</title>
<meta name="theme-color" content="#f6f7f9">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #646b78; --line: #dfe2e8;
  --accent: #2557d6; --accent-soft: #e6edfc; --ok: #13804b; --ok-soft: #e3f4ea;
  --bad: #c9302c; --bad-soft: #fbe7e6; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --card: #1b1e24; --text: #eceef2; --muted: #9aa1ad; --line: #2e333c;
    --accent: #7ea2ff; --accent-soft: #1f2a44; --ok: #4cc38a; --ok-soft: #17301f;
    --bad: #ff7b72; --bad-soft: #3a1d1c; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 680px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
h1 { font-size: 22px; margin: 8px 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
.label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 8px; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--line); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: transparent; padding: 10px 6px; border-radius: 9px; font-weight: 600; font-size: 15px; }
.seg button small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: var(--shadow); }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.stat { background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.stat b { font-size: 22px; display: block; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }

.modes { display: grid; gap: 8px; }
.mode { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.mode:disabled { opacity: .45; cursor: default; }
.mode .ic { width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 18px; font-weight: 700; }
.mode b { display: block; }
.mode span { color: var(--muted); font-size: 14px; }
.pills { display: flex; gap: 6px; margin-top: 8px; }
.pills button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.pills button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 8px 0; margin-top: 24px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.back { border: 0; background: none; color: var(--accent); padding: 6px 0; font-weight: 600; }
.count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 18px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; margin-bottom: 10px; }
.question { font-size: 18px; font-weight: 600; white-space: pre-line; margin: 0 0 16px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; transition: border-color .15s, background-color .15s; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.opt.multi .k { border-radius: 6px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { border-color: var(--accent); background: var(--accent); color: #fff; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .k { border-color: var(--ok); background: var(--ok); color: #fff; }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .k { border-color: var(--bad); background: var(--bad); color: #fff; }
.opt.missed { border-color: var(--ok); border-style: dashed; }
.opt.missed .k { border-color: var(--ok); color: var(--ok); }
.opt:disabled { cursor: default; color: var(--text); }
.feedback { margin-top: 14px; font-weight: 600; min-height: 1.4em; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }

.dock { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); }
.dock div { max-width: 680px; margin: 0 auto; }
.primary { width: 100%; border: 0; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 16px; background: var(--accent); color: #fff; }
.primary:disabled { background: var(--line); color: var(--muted); cursor: default; }

.score { text-align: center; background: var(--card); border-radius: 16px; padding: 24px 16px; box-shadow: var(--shadow); }
.score b { font-size: 44px; display: block; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); }
.review { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-top: 10px; box-shadow: var(--shadow); }
.review p { margin: 0 0 8px; font-weight: 600; white-space: pre-line; }
.review li { margin: 4px 0; }
.review .yes { color: var(--ok); font-weight: 600; }
.review .no { color: var(--bad); text-decoration: line-through; }
.review ul { margin: 0; padding: 0; list-style: none; }
.review .no::before { content: "✗ "; display: inline-block; text-decoration: none; margin-right: 4px; }
.row { display: grid; gap: 8px; margin-top: 16px; }
.ghost { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px; font-weight: 600; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="dock" id="dock" hidden><div><button class="primary" id="primary"></button></div></div>

"Виды ядерных взрывов: (выберите неправильные ответы)."],"a":[{"t":"подземный – подводный","ok":false},{"t":"высотный – воздушный","ok":false},{"t":"наземный – надводный","ok":false},{"t":"масштабный – космический","ok":true},{"t":"средний – крупный","ok":true}]},{"q":["Что необходимо взять с собой в случае объявления эвакуации?"],"a":[{"t":"всю ценную посуду и украшения","ok":false},{"t":"сумку с документами, деньгами","ok":true},{"t":"сумку с медикаментами","ok":true},{"t":"телевизор и другую бытовую технику","ok":false},{"t":"одежду","ok":false}]},{"q":["Какие из перечисленных видов ответственности за участие в массовых беспорядках? Выберите все правильные ответы."],"a":[{"t":"административная","ok":true},{"t":"правовая","ok":false},{"t":"уголовная","ok":true},{"t":"гражданско-правовая","ok":false},{"t":"дисциплинарная","ok":false}]},{"q":["Где лучше занять место, зайдя в кафе или ресторан?"],"a":[{"t":"подальше от выхода, спиной к стене","ok":true},{"t":"поближе к выходу, спиной к стене","ok":false},{"t":"рядом со стойкой","ok":true},{"t":"подальше от стойки","ok":false},{"t":"в слабо освещённом углу, чтобы не заметили","ok":false}]},{"q":["Какие виды аварий не относится к ЧС техногенного характера?"],"a":[{"t":"гидродинамические","ok":false},{"t":"транспортные","ok":false},{"t":"природные пожары","ok":true},{"t":"аварии на РОО","ok":false},{"t":"биологические опасности","ok":true}]}]};
const BLOCKS = { A: { name: 'Блок А', multi: false }, V: { name: 'Блок В', multi: true } };
const LETTERS = ['а', 'б', 'в', 'г', 'д', 'е', 'ж'];
const EXAM_SIZES = [20, 30, 50];
const STORE_KEY = 'bzhd-trainer-v1';

const ALL = Object.keys(BLOCKS).flatMap((b) => DATA[b].map((q, i) => ({
  id: b + i, block: b, num: i + 1, text: q.q.join('\n'),
  answers: q.a.map((a) => a.t), correct: q.a.flatMap((a, j) => (a.ok ? [j] : [])),
})));
const BY_ID = Object.fromEntries(ALL.map((q) => [q.id, q]));

function loadStore() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (raw && typeof raw === 'object') return { last: raw.last || {}, pos: raw.pos || {}, scope: raw.scope || 'A', exam: raw.exam || 30 };
  } catch (e) { /* storage unavailable — work without it */ }
  return { last: {}, pos: {}, scope: 'A', exam: 30 };
}
let store = loadStore();
function save(patch) {
  store = { ...store, ...patch };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignore */ }
}

const app = document.getElementById('app');
const dock = document.getElementById('dock');
const primary = document.getElementById('primary');
let session = null;
let onPrimary = null;

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'on') Object.entries(v).forEach(([ev, fn]) => node.addEventListener(ev, fn));
    else if (k === 'text') node.textContent = v;
    else if (v !== false && v != null) node.setAttribute(k, v === true ? '' : v);
  });
  kids.flat().forEach((c) => c != null && node.append(c));
  return node;
}
function setDock(label, handler, disabled = false) {
  dock.hidden = !label;
  primary.textContent = label || '';
  primary.disabled = disabled;
  onPrimary = handler;
}
primary.addEventListener('click', () => onPrimary && onPrimary());

function scopeIds(scope) { return ALL.filter((q) => scope === 'AV' || q.block === scope).map((q) => q.id); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

/* ---------- home ---------- */
function renderHome() {
  session = null;
  const scope = store.scope;
  const ids = scopeIds(scope);
  const solved = ids.filter((id) => store.last[id] === 1).length;
  const wrong = ids.filter((id) => store.last[id] === 0);
  const pos = store.pos[scope] || 0;
  setDock(null);

  const segBtn = (key, title) => el('button', { 'aria-pressed': String(scope === key), on: { click: () => { save({ scope: key }); renderHome(); } } },
    title, el('small', { text: `${scopeIds(key).length} вопр.` }));
  const mode = (ic, title, desc, handler, disabled = false) => el('button', { class: 'mode', disabled, on: { click: handler } },
    el('span', { class: 'ic', text: ic }), el('div', {}, el('b', { text: title }), el('span', { text: desc })));

  app.replaceChildren(
    el('h1', { text: 'Тренажёр БЖД' }),
    el('p', { class: 'sub', text: 'Безопасность жизнедеятельности — блоки А и В' }),
    el('div', { class: 'seg' }, segBtn('A', 'Блок А'), segBtn('V', 'Блок В'), segBtn('AV', 'Оба')),
    el('div', { class: 'stats' },
      el('div', { class: 'stat' }, el('b', { text: `${solved} / ${ids.length}` }), el('span', { text: 'отвечено верно' }),
        el('div', { class: 'bar' }, el('i', { style: `width:${(solved / ids.length) * 100}%` }))),
      el('div', { class: 'stat' }, el('b', { text: String(wrong.length) }), el('span', { text: 'ошибок на повторение' }))),
    el('div', { class: 'label', text: 'Режим' }),
    el('div', { class: 'modes' },
      mode('1→', 'По порядку', pos > 0 && pos < ids.length ? `продолжить с вопроса ${pos + 1}` : 'все вопросы подряд',
        () => startSession('order', pos > 0 && pos < ids.length ? ids.slice(pos) : ids, pos > 0 && pos < ids.length ? pos : 0)),
      mode('⤨', 'Вразброс', 'все вопросы в случайном порядке', () => startSession('random', shuffle(ids))),
      mode('!', 'Мои ошибки', wrong.length ? `${wrong.length} ${plural(wrong.length, 'вопрос', 'вопроса', 'вопросов')}, где была ошибка` : 'ошибок пока нет',
        () => startSession('errors', shuffle(wrong)), wrong.length === 0),
      el('div', {},
        mode('✓', 'Экзамен', `${store.exam} случайных вопросов, ответы — только в конце`, () => startSession('exam', shuffle(ids).slice(0, store.exam))),
        el('div', { class: 'pills' }, EXAM_SIZES.map((n) => el('button', {
          'aria-pressed': String(store.exam === n), text: `${n} вопр.`, on: { click: () => { save({ exam: n }); renderHome(); } },
        }))))),
    el('button', { class: 'link', text: 'Сбросить прогресс', on: { click: () => {
      if (confirm('Сбросить весь прогресс и список ошибок?')) { save({ last: {}, pos: {} }); renderHome(); }
    } } }),
  );
  window.scrollTo(0, 0);
}

/* ---------- quiz ---------- */
function startSession(mode, ids, offset = 0) {
  if (!ids.length) return;
  session = { mode, ids, i: 0, offset, total: offset + ids.length, results: [], scope: store.scope };
  renderQuestion();
}

function renderQuestion() {
  const q = BY_ID[session.ids[session.i]];
  const multi = BLOCKS[q.block].multi;
  const exam = session.mode === 'exam';
  const order = shuffle(q.answers.map((_, j) => j));
  const picked = new Set();
  let answered = false;

  const buttons = order.map((j, k) => el('button', {
    class: 'opt' + (multi ? ' multi' : ''), on: { click: () => pick(j) },
  }, el('span', { class: 'k', text: LETTERS[k] }), el('span', { text: q.answers[j] })));
  const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });

  function paintSelection() {
    order.forEach((j, k) => buttons[k].classList.toggle('sel', picked.has(j)));
    setDock(exam ? 'Ответить' : 'Проверить', check, picked.size === 0);
  }
  function pick(j) {
    if (answered) return;
    if (multi) { picked.has(j) ? picked.delete(j) : picked.add(j); paintSelection(); return; }
    picked.clear(); picked.add(j);
    if (exam) paintSelection(); else check();
  }
  function check() {
    if (answered || picked.size === 0) return;
    answered = true;
    const ok = picked.size === q.correct.length && q.correct.every((j) => picked.has(j));
    session.results.push({ id: q.id, ok, picked: [...picked] });
    save({ last: { ...store.last, [q.id]: ok ? 1 : 0 } });
    if (session.mode === 'order') save({ pos: { ...store.pos, [session.scope]: session.offset + session.i + 1 } });
    if (exam) { next(); return; }
    order.forEach((j, k) => {
      const b = buttons[k];
      b.disabled = true;
      b.classList.remove('sel');
      const isCorrect = q.correct.includes(j);
      if (isCorrect && picked.has(j)) b.classList.add('ok');
      else if (isCorrect) b.classList.add(multi ? 'missed' : 'ok');
      else if (picked.has(j)) b.classList.add('bad');
    });
    feedback.className = 'feedback ' + (ok ? 'ok' : 'bad');
    feedback.textContent = ok ? 'Верно!' : (multi ? 'Неверно. Зелёным — правильные ответы, пунктиром — те, что вы пропустили.' : 'Неверно. Правильный ответ выделен зелёным.');
    setDock(session.i + 1 < session.ids.length ? 'Дальше' : 'Результат', next);
  }
  function next() {
    session.i += 1;
    if (session.i < session.ids.length) renderQuestion(); else renderResult();
  }
  session.keys = (e) => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= order.length) pick(order[n - 1]);
    else if (e.key === 'Enter' && !primary.disabled && !dock.hidden) { e.preventDefault(); primary.click(); }
  };

  const shown = session.offset + session.i + 1;
  const tagText = `${BLOCKS[q.block].name} · №${q.num}` + (multi ? ' · несколько правильных ответов' : '');
  app.replaceChildren(
    el('div', { class: 'top' },
      el('button', { class: 'back', text: '← Меню', on: { click: () => (session.results.length && !confirm('Выйти в меню? Прогресс сохранится.') ? null : renderHome()) } }),
      el('span', { class: 'count', text: `${shown} из ${session.total}` })),
    el('div', { class: 'progress' }, el('i', { style: `width:${((shown - 1) / session.total) * 100}%` })),
    el('span', { class: 'tag', text: tagText }),
    el('p', { class: 'question', text: q.text }),
    el('div', { class: 'opts' }, buttons),
    feedback,
  );
  if (multi || exam) paintSelection(); else setDock(null);
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', (e) => { if (session && session.keys) session.keys(e); });

/* ---------- result ---------- */
function renderResult() {
  const { results, mode } = session;
  const good = results.filter((r) => r.ok).length;
  const pct = Math.round((good / results.length) * 100);
  const mistakes = results.filter((r) => !r.ok);
  if (mode === 'order') save({ pos: { ...store.pos, [session.scope]: 0 } });
  session = null;
  setDock('В меню', renderHome);

  const review = mistakes.map((r) => {
    const q = BY_ID[r.id];
    return el('div', { class: 'review' },
      el('p', { text: `${BLOCKS[q.block].name} №${q.num}. ${q.text}` }),
      el('ul', {}, q.answers.map((t, j) => {
        const isCorrect = q.correct.includes(j);
        if (isCorrect) return el('li', { class: 'yes', text: '✓ ' + t });
        if (r.picked.includes(j)) return el('li', { class: 'no', text: t });
        return null;
      })));
  });

  app.replaceChildren(
    el('h1', { text: mode === 'exam' ? 'Экзамен окончен' : 'Готово' }),
    el('div', { class: 'score' }, el('b', { text: `${pct}%` }), el('span', { text: `верно ${good} из ${results.length}` })),
    ...(mistakes.length ? [el('div', { class: 'row' },
      el('button', { class: 'ghost', text: `Прорешать ошибки этой попытки (${mistakes.length})`, on: { click: () => { startSession('errors', shuffle(mistakes.map((r) => r.id))); } } }))] : []),
    ...(mistakes.length ? [el('div', { class: 'label', text: 'Разбор ошибок' })] : []),
    ...review,
  );
  window.scrollTo(0, 0);
}

renderHome();
</script>
</body>
